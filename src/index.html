<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iA Clone</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/themes.css">
    <link rel="stylesheet" href="styles/editor.css">
    <link rel="stylesheet" href="styles/focus.css">
</head>
<body>
    <div id="app">
        <div id="editor-container">
            <div id="editor"></div>
        </div>
        <div id="preview-container" class="hidden">
            <div id="preview"></div>
        </div>
    </div>

    <!-- View options button and dropdown -->
    <div id="view-options-container">
        <button id="view-options-toggle" aria-label="View options" title="View options">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                <path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <div id="view-options-dropdown" class="view-dropdown hidden">
            <div class="view-section">
                <div class="view-section-header">Enable Focus Mode</div>
                <button class="view-option" data-action="focus-mode" data-mode="sentence">
                    <span class="option-indicator"></span>Sentence
                </button>
                <button class="view-option" data-action="focus-mode" data-mode="paragraph">
                    <span class="option-indicator"></span>Paragraph
                </button>
                <button class="view-option" data-action="focus-mode" data-mode="typewriter">
                    <span class="option-indicator"></span>Typewriter
                </button>
            </div>
            
            <div class="view-section">
                <div class="view-section-header">Enable Style Check</div>
                <button class="view-option" data-action="style-check" data-type="fillers">
                    <span class="option-indicator"></span>Fillers
                </button>
                <button class="view-option" data-action="style-check" data-type="cliches">
                    <span class="option-indicator"></span>Clichés
                </button>
                <button class="view-option" data-action="style-check" data-type="redundancies">
                    <span class="option-indicator"></span>Redundancies
                </button>
                <button class="view-option" data-action="style-check" data-type="custom">
                    <span class="option-indicator"></span>Custom
                </button>
            </div>
            
            <div class="view-section">
                <div class="view-section-header">Show Authors</div>
                <button class="view-option" data-action="author" data-type="human">
                    <span class="option-indicator"></span>Human
                </button>
                <button class="view-option" data-action="author" data-type="other">
                    <span class="option-indicator"></span>Other
                </button>
            </div>
        </div>
    </div>

    <!-- Theme toggle button (subtle, top-right) -->
    <button id="theme-toggle" aria-label="Toggle theme" title="Toggle theme (Cmd/Ctrl+Shift+T)">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>
        </svg>
    </button>

    <!-- Formatting toolbar -->
    <div id="formatting-toolbar">
        <div class="toolbar-left">
            <button class="toolbar-btn" data-action="body" title="Body text">Body</button>
            <div class="toolbar-dropdown">
                <button class="toolbar-btn has-dropdown" data-action="heading" title="Heading">Heading 1 <span class="dropdown-arrow">▾</span></button>
                <div class="dropdown-menu">
                    <button data-action="heading" data-level="1">Heading 1</button>
                    <button data-action="heading" data-level="2">Heading 2</button>
                    <button data-action="heading" data-level="3">Heading 3</button>
                    <button data-action="heading" data-level="4">Heading 4</button>
                    <button data-action="heading" data-level="5">Heading 5</button>
                    <button data-action="heading" data-level="6">Heading 6</button>
                </div>
            </div>
            <div class="toolbar-dropdown">
                <button class="toolbar-btn has-dropdown" data-action="list" title="List">List <span class="dropdown-arrow">▾</span></button>
                <div class="dropdown-menu">
                    <button data-action="list" data-type="bullet">Bullet List</button>
                    <button data-action="list" data-type="numbered">Numbered List</button>
                </div>
            </div>
            <button class="toolbar-btn" data-action="blockquote" title="Blockquote">Blockquote</button>
            <button class="toolbar-btn format-bold" data-action="bold" title="Bold (Cmd+B)">Bold</button>
            <button class="toolbar-btn format-italic" data-action="italic" title="Italic (Cmd+I)">Italic</button>
            <button class="toolbar-btn" data-action="strikethrough" title="Strikethrough">Strikethrough</button>
            <button class="toolbar-btn" data-action="link" title="Link (Cmd+K)">Link</button>
            <button class="toolbar-btn" data-action="wikilink" title="Wikilink">Wikilink</button>
            <button class="toolbar-btn" data-action="footnote" title="Footnote">Footnote</button>
            <button class="toolbar-btn" data-action="table" title="Table">Table</button>
            <button class="toolbar-btn" data-action="toc" title="Table of Contents">TOC</button>
        </div>
        <div class="toolbar-right">
            <span id="word-count">0 Words</span>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
